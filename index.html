            flex-wrap: wrap;
            direction: ltr;
        }

        .white-text { color: #ffffff; }
        .green-text {

            text-shadow: 0 0 10px rgba(80, 227, 194, 0.4);

            border-radius: 30px;

            letter-spacing: 1px;
            cursor: default;
            display: inline-block;
        }

        .date-highlight {
            color: white;
        }

        .tagline {
            font-size: 1rem;
            color: #cfcfcf;
            line-height: 1.7;
            margin: 0 0 5px 0;
        }

        /* ========================================= */
        /* تنسيق العداد التنازلي (Timer)              */
        /* ========================================= */
        .countdown-container {
            margin-top: 25px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px 20px;
            min-width: 60px;
            border: 1px solid rgba(255, 140, 50, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-box span {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ff8c32;
            display: block;
        }

        .time-box small {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* ========================================= */
        /* تأثيرات حركية (Animations)                 */
        /* ========================================= */
        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(255, 140, 50, 0.5); transform: scale(1); }
            70% { box-shadow: 0 0 0 15px rgba(255, 140, 50, 0); transform: scale(1.05); }
            100% { box-shadow: 0 0 0 0 rgba(255, 140, 50, 0); transform: scale(1); }
        }

        .fade-in {
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========================================= */
        /* تنسيق للجوال (Responsive)                  */
        /* ========================================= */

            .time-box { padding: 10px 15px; min-width: 40px; }
            .time-box span { font-size: 1.5rem; }
            .countdown-container { gap: 10px; }

        <p class="tagline fade-in">أفضل برنامج لإدارة الاشتراكات للجيمات في العراق<br>U GYM.online رفيقك في كل جيم</p>

        <!-- تاريخ الافتتاح الكامل مع حركة نبض -->
        <div class="opening-date pulse fade-in">
            الافتتاح الرسمي <br>
            <span class="date-highlight">1 سبتمبر 2026</span>
        </div>

        <!-- العداد التنازلي -->
        <div class="countdown-container fade-in" id="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <small>يوم</small>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <small>ساعة</small>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <small>دقيقة</small>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <small>ثانية</small>
            </div>
        </div>
    </div>

    <!-- كود الجافاسكريبت للعداد التنازلي -->
    <script>
        // تحديد تاريخ الافتتاح الجديد (1 سبتمبر 2026)
        const openingDate = new Date("Sep 1, 2026 00:00:00").getTime();

        // تحديث العداد كل ثانية
        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = openingDate - now;

            // حساب الوقت المتبقي
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // عرض الوقت في الصفحة (مع إضافة صفر إذا كان الرقم أقل من 10)
            document.getElementById("days").innerHTML = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerHTML = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerHTML = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerHTML = seconds < 10 ? "0" + seconds : seconds;

            // إذا انتهى الوقت (تم الافتتاح)
            if (distance < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "<h2 style='color:#50e3c2; margin-top:10px;'>🎉 لقد تم الافتتاح! 🎉</h2>";
            }
        }, 1000);
    </script>
